[package]
name = "gantry-crane-sandbox-app"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crane_model = { package = "crane_sandbox", path = ".." }

[build-dependencies]
tauri-build = { version = "1", features = [] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
cuda = ["crane_model/cuda"]
rocm = ["crane_model/rocm"]
vulkan = ["crane_model/vulkan"]

[patch.crates-io]
candle-core = { git = "https://github.com/Qntology/candle-rocm-vulkan.git" }
candle-nn = { git = "https://github.com/Qntology/candle-rocm-vulkan.git" }

[profile.dev.package."*"]
opt-level = 3
